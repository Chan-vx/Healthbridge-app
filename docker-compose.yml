services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: healthbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthbridge}
      POSTGRES_DB: healthbridge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthbridge -d healthbridge"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://healthbridge:${POSTGRES_PASSWORD:-healthbridge}@db:5432/healthbridge
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploying}
      CORS_ORIGINS: http://localhost:3000
      SEED_DEMO: ${SEED_DEMO:-true}
      UPLOAD_DIR: /srv/uploads
    volumes:
      - uploads:/srv/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
